
<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Verify</title>
<style>
body{font-family:Arial;margin:0;padding:10px;text-align:center}
video{width:100%;max-height:60vh;background:#000}
button{padding:14px 20px;font-size:18px;background:#111;color:#fff;border:0;margin:8px}
#code{font-size:40px;font-weight:bold}
</style></head><body>
<h3>Room verification</h3>
<video id="v" autoplay playsinline muted></video>
<h2 id="msg">Tap Start</h2>
<button id="btn" onclick="start()">Start</button>
<script>
const token=new URLSearchParams(location.search).get("t");
let heading=null, pos=null, order=[], code="", step=0, readings=[];
function tiltHeading(a,b,g){
  const r=Math.PI/180; a*=r; b*=r; g*=r;
  const rA=-Math.cos(a)*Math.sin(g)-Math.sin(a)*Math.sin(b)*Math.cos(g);
  const rB=-Math.sin(a)*Math.sin(g)+Math.cos(a)*Math.sin(b)*Math.cos(g);
  let h=Math.atan(rA/rB);
  if(rB<0) h+=Math.PI; else if(rA<0) h+=2*Math.PI;
  return h/r;
}
function onOri(e){
  if(e.webkitCompassHeading!=null) heading=e.webkitCompassHeading;
  else if(e.absolute && e.alpha!=null) heading=tiltHeading(e.alpha,e.beta,e.gamma);
}
async function start(){
  const info=await (await fetch("/link/"+token)).json();
  if(info.error){msg.textContent=info.error;return}
  order=info.order; code=info.code;
  if(typeof DeviceOrientationEvent!=="undefined" && DeviceOrientationEvent.requestPermission){
    const p=await DeviceOrientationEvent.requestPermission();
    if(p!=="granted"){msg.textContent="Compass permission is required.";return}
  }
  window.addEventListener("deviceorientationabsolute",onOri,true);
  window.addEventListener("deviceorientation",onOri,true);
  try{
    v.srcObject=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"},audio:false});
    pos=await new Promise((ok,no)=>navigator.geolocation.getCurrentPosition(ok,no,{enableHighAccuracy:true}));
  }catch(e){msg.textContent="Please allow camera and location: "+e.message;return}
  btn.textContent="Capture"; btn.onclick=capture; prompt_();
}
function prompt_(){
  if(step<order.length) msg.textContent=`Stand at the ${order[step]}, point the phone at it (hold it upright like taking a photo), then tap Capture`;
  else msg.innerHTML=`Write this number on paper:<div id="code">${code}</div>Hold the paper in front of the camera, then tap Capture`;
}
async function capture(){
  if(step<order.length){
    if(heading==null){msg.textContent="No compass reading. Move the phone in a figure 8 and retry.";return}
    readings.push({item:order[step],heading:heading}); step++; prompt_(); return;
  }
  const c=document.createElement("canvas"); c.width=v.videoWidth; c.height=v.videoHeight;
  c.getContext("2d").drawImage(v,0,0);
  const frame=c.toDataURL("image/jpeg",0.8).split(",")[1];
  msg.textContent="Checking...";
  const r=await (await fetch("/verify/"+token,{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({lat:pos.coords.latitude,lng:pos.coords.longitude,timestamp:Date.now(),readings,frame})})).json();
  msg.textContent=r.error?r.error:(r.verified?"Verified! You can close this page.":"Verification failed.");
  btn.style.display="none";
}
</script></body></html>
